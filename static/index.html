<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Личный бюджет</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/planner.css" />
  <link rel="stylesheet" href="/css/calendar.css" />
  <link rel="stylesheet" href="/css/navigation.css" />
<link rel="icon" href="/favicon.ico" sizes="16x16 32x32">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" sizes="any">
  <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="icon" href="/favicon-16.png" type="image/png" sizes="16x16">
</head>
<body>
  <div class="app">
    <header class="header app-navigation" aria-label="Навигация приложения">
      <div class="app-module-switch">
        <button type="button" id="module-switch" aria-expanded="false" aria-controls="module-menu">Планы <span aria-hidden="true">⌄</span></button>
        <div id="module-menu" hidden aria-label="Выбор модуля">
          <a href="#/plans/calendar" data-module="plans">Планы</a>
          <a href="#/" data-module="budget">Бюджет</a>
        </div>
      </div>
      <nav id="module-tabs" class="app-module-tabs" aria-label="Основные разделы"></nav>
      <div class="app-navigation-tools">
        <div class="header-search" id="budget-search" hidden>
          <input type="text" id="search-input" class="search-input" placeholder="Поиск по операциям..." autocomplete="off" />
          <div id="search-results" class="search-results" aria-hidden="true"></div>
        </div>
        <button type="button" id="backup-button" class="header-backup" hidden title="Скачать копию данных">Бэкап</button>
        <a class="app-settings" href="#/plans/settings" aria-label="Настройки планировщика" title="Настройки">⚙</a>
        <span id="environment-marker"></span>
      </div>
    </header>
    <main id="root" class="main"></main>
  </div>
  <div id="modal-root"></div>
  <script src="/vendor/chart.umd-4.4.0.js"></script>
  <script src="/js/view-sync.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/planner/core.js"></script>
  <script src="/js/planner/calendar-model.js"></script>
  <script src="/js/planner/calendar-days.js"></script>
  <script src="/js/planner/calendar.js"></script>
  <script src="/js/planner/task-groups.js"></script>
  <script src="/js/planner/navigation.js"></script>
  <script src="/js/planner/views.js"></script>
  <script src="/js/planner/editor.js"></script>
  <script src="/js/planner/recurrence-form.js"></script>
  <script src="/js/planner/series.js"></script>
  <script src="/js/planner/occurrences.js"></script>
  <script src="/js/planner/templates.js"></script>
  <script src="/js/planner/attention.js"></script>
  <script src="/js/planner/production-calendar.js"></script>
  <script src="/js/planner/actions.js"></script>
  <script src="/js/planner/lifecycle.js"></script>
  <script src="/js/planner/disclosure.js"></script>
  <script src="/js/planner/icon-catalog.js"></script>
  <script src="/js/planner/appearance.js"></script>
  <script src="/js/planner/entity-templates.js"></script>
  <script src="/js/planner/beta2.js"></script>
  <script src="/js/planner/beta3.js"></script>
  <script src="/js/planner/repeat-editor.js"></script>
  <script src="/js/navigation.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/live.js"></script>
<script src="/js/environment.js"></script></body>
</html>
