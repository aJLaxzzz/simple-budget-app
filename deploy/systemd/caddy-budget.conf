[Service]
ExecStartPre=+/usr/local/sbin/budget-admin proxy-guard production
# Keep the existing APT unit, user, ACME storage and certificates.
# No network administration API: configuration changes use bounded restart.
ExecStart=
ExecStart=/usr/bin/caddy run --config /etc/caddy/simple-budget.json
ExecReload=
TimeoutStopSec=20
KillMode=control-group
